<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | Salty & Rated</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    :root{--navy:#001028;--gold:#e4b448;--text:#001028;--border:#d6d7d9;--gray-bg:#f1f1f1}
    @font-face{font-family:"Oswald";src:url("/fonts/oswald-latin.woff2") format("woff2");font-display:swap}
    @font-face{font-family:"Inter";src:url("/fonts/inter-latin.woff2") format("woff2");font-display:swap}
    body{margin:0;font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.5}
    .banner{background:var(--navy);color:#fff;padding:32px 0 28px;text-align:center;position:relative}
    .banner::before{content:"";display:block;width:140px;height:20px;margin:0 auto 14px;background:var(--gold);border-radius:4px}
    .banner h1{margin:0;font-family:"Oswald",sans-serif;font-size:2.2rem;font-weight:700;letter-spacing:-0.02em}
    .wrap{max-width:860px;margin:0 auto;padding:0 16px}
    .card{border:1px solid var(--border);border-radius:8px;padding:28px 24px;margin:32px auto;max-width:520px;text-align:center}
    .card h2{margin-top:0;color:var(--navy);font-family:"Oswald",sans-serif;font-size:1.5rem}
    .card p{color:#5c5c5c;font-size:1rem}
    .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
    .btn-secondary{display:inline-block;background:#fff;color:var(--navy);border:2px solid var(--navy);font-weight:700;padding:10px 18px;border-radius:4px;text-decoration:none;font-family:"Oswald",sans-serif}
    .btn-secondary:hover{background:var(--gray-bg)}
  </style>
</head>
<body>
  <header class="banner">
    <div class="wrap">
      <h1>Salty &amp; Rated</h1>
    </div>
  </header>
  <main class="wrap">
    <div class="card">
      <h2>404 — Page Not Found</h2>
      <p>That page doesn't exist, or the link's out of date. Try one of these:</p>
      <div class="links">
        <a class="btn-secondary" href="/">Home</a>
        <a class="btn-secondary" href="/calculator/">VA Rating Calculator</a>
        <a class="btn-secondary" href="/va-claims-prompt/">Free AI Prompt</a>
      </div>
    </div>
  </main>
</body>
</html>
